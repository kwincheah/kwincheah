<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Cheah Ken Win: AI and full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#111B2E"/>
      <stop offset="1" stop-color="#0B2A3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#3FB950"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.88" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="300" rx="20" fill="url(#glowA)"/>
  <rect width="1280" height="300" rx="20" fill="url(#glowB)"/>

  <!-- Code-bracket mark -->
  <g transform="translate(96 88)" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 0L0 62l40 62"/>
    <path d="M124 0l40 62-40 62"/>
    <path d="M100 -4L64 128"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="330" y="118" fill="#8B949E" font-size="22" font-weight="500" letter-spacing="3">HI THERE, I'M</text>
    <text x="328" y="178" fill="#F0F6FC" font-size="60" font-weight="800" letter-spacing="-1">Cheah Ken Win</text>
    <text x="330" y="222" fill="url(#accent)" font-size="26" font-weight="600">AI &amp; full-stack developer</text>
    <text x="330" y="256" fill="#8B949E" font-size="18">Speech · Vision · LLM apps  ·  Python · FastAPI · Next.js · Docker</text>
  </g>
</svg>
